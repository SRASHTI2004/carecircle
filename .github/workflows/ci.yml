name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Types (mypy)
        run: mypy app
      - name: Tests with coverage (must stay above 90%)
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint incl. jsx-a11y) and format check
        run: npm run lint && npm run format:check
      - name: Unit, screen and accessibility (axe) tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev
