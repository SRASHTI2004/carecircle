services:
  - type: web
    name: carecircle
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: REMINDER_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://carecircle.onrender.com
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # Optional - set these in the Render dashboard (never commit them):
      # GEMINI_API_KEY, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, FROM_EMAIL
